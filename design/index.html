<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影软小铺 · 设计稿总览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #f7f2ea;
    color: #3a2c1c;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  .bar {
    flex: 0 0 auto;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 20px;
    background: #fdf9f3;
    border-bottom: 1px solid #ecdfc9;
  }
  .bar .mark {
    width: 26px; height: 26px;
    border-radius: 8px;
    background: linear-gradient(150deg, #d99a52, #b06f2c);
    flex: 0 0 auto;
  }
  .bar h1 {
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .bar h1 em {
    font-style: normal;
    font-size: 11.5px;
    font-weight: 400;
    color: #8a7458;
    margin-left: 9px;
  }
  .bar .sp { flex: 1; }
  .bar .act {
    font-size: 12px;
    color: #a3672a;
    text-decoration: none;
    padding: 7px 12px;
    border: 1px solid #e6d3b4;
    border-radius: 8px;
    background: #fffdf9;
    white-space: nowrap;
  }
  .bar .act:hover { background: #fbf0e1; }

  /* ---------- 主体 ---------- */
  .wrap { flex: 1 1 auto; display: flex; min-height: 0; }

  .side {
    flex: 0 0 268px;
    background: #fbf7f1;
    border-right: 1px solid #ecdfc9;
    overflow-y: auto;
    padding: 14px 12px 20px;
  }
  .side .cap {
    font-size: 10.5px;
    letter-spacing: 1.2px;
    color: #b09a7c;
    padding: 6px 8px 10px;
    text-transform: uppercase;
  }
  .item {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    border-radius: 10px;
    padding: 10px 11px;
    cursor: pointer;
    font-family: inherit;
    color: #3a2c1c;
    position: relative;
    transition: background .15s;
  }
  .item:hover { background: #f4ecdf; }
  .item.on { background: #fbf0e1; box-shadow: inset 0 0 0 1px #eddcbf; }
  .item.on::before {
    content: "";
    position: absolute;
    left: 0; top: 10px; bottom: 10px;
    width: 3px;
    border-radius: 3px;
    background: #c07b3a;
  }
  .item .n {
    font-size: 10px;
    font-weight: 700;
    color: #c07b3a;
    margin-right: 6px;
  }
  .item .t { font-size: 13px; font-weight: 600; }
  .item .d {
    display: block;
    font-size: 11px;
    line-height: 1.5;
    color: #8a7458;
    margin-top: 3px;
  }

  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 2px 10px 12px;
  }
  .chips button {
    font-family: inherit;
    font-size: 10.5px;
    line-height: 1.4;
    color: #6b563c;
    background: #fffdf9;
    border: 1px solid #e6d3b4;
    border-radius: 7px;
    padding: 5px 2px;
    text-align: center;
    cursor: pointer;
  }
  .chips button:first-child { grid-column: 1 / -1; }
  .chips button:hover { background: #fbf0e1; }
  .chips button.on {
    background: #c07b3a;
    border-color: #c07b3a;
    color: #fff;
  }

  .tip {
    margin: 16px 8px 0;
    padding: 10px 11px;
    border-radius: 10px;
    background: #f6eedf;
    border: 1px dashed #e3d2b4;
    font-size: 10.5px;
    line-height: 1.65;
    color: #8a7458;
  }
  .tip b { color: #a3672a; font-weight: 600; }

  .stage {
    flex: 1 1 auto;
    min-width: 0;
    background: #eae2d5;
    position: relative;
  }
  iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
    transform-origin: top left;
  }

  @media (max-width: 820px) {
    .wrap { flex-direction: column; }
    .side {
      flex: 0 0 auto;
      width: 100%;
      border-right: 0;
      border-bottom: 1px solid #ecdfc9;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 10px;
    }
    .side .cap, .tip { display: none; }
    .item { width: auto; flex: 0 0 auto; }
    .item .d { display: none; }
    .chips { padding: 10px; flex: 0 0 auto; flex-wrap: nowrap; }
  }
</style>
</head>
<body>

<div class="bar">
  <div class="mark"></div>
  <h1>影软小铺 · 设计稿总览<em>4 份设计稿 · 6 套配色 · 一页内嵌</em></h1>
  <div class="sp"></div>
  <a class="act" id="openNew" href="ui-design-v1.html" target="_blank" rel="noopener">新窗口打开 ↗</a>
</div>

<div class="wrap">
  <nav class="side">
    <div class="cap">设计过程</div>

    <button class="item" data-key="ui" data-file="ui-design-v1.html">
      <span class="n">01</span><span class="t">初版高保真</span>
      <span class="d">11 个页面 + 跳转关系图 + 接口映射 + 4 个待确认决策</span>
    </button>

    <button class="item" data-key="light" data-file="light-theme-preview.html">
      <span class="n">02</span><span class="t">浅色配色选型</span>
      <span class="d">6 套浅色方案并排对比，每套渲染「首页 + 我的」</span>
    </button>
    <div class="chips" id="chips">
      <button data-plan="" class="on">全部</button>
      <button data-plan="A">A 雾青绿</button>
      <button data-plan="B">B 晨雾白</button>
      <button data-plan="C">C 暖砂米</button>
      <button data-plan="D">D 冰川蓝</button>
      <button data-plan="E">E 藕荷紫</button>
      <button data-plan="F">F 樱雪粉</button>
    </div>

    <button class="item" data-key="sand" data-file="theme-c-sand.html">
      <span class="n">03</span><span class="t">方案 C 落地效果</span>
      <span class="d">用真实 app.wxss / 页面 wxss 转 CSS 渲染的首屏</span>
    </button>

    <button class="item" data-key="fullbleed" data-file="tabs-fullbleed.html">
      <span class="n">04</span><span class="t">四 Tab 顶部全铺满</span>
      <span class="d">首页 / 分类 / 订单 / 我的，去掉系统白导航栏后并排</span>
    </button>

    <div class="tip">
      Markdown（GitHub / VS Code / Typora）会剥离 <b>iframe</b> 与 script，所以 README 里只能放链接；
      这一页用 iframe 把四份设计稿真实内嵌，作为统一入口。
    </div>
  </nav>

  <div class="stage">
    <iframe id="frame" src="ui-design-v1.html" title="设计稿预览"></iframe>
  </div>
</div>

<script>
  var frame = document.getElementById('frame');
  var stage = document.querySelector('.stage');
  var openNew = document.getElementById('openNew');
  var items = Array.prototype.slice.call(document.querySelectorAll('.item'));
  var chips = Array.prototype.slice.call(document.querySelectorAll('#chips button'));
  var currentPlan = '';
  var currentKey = '';

  // 四页并排稿按 1660 宽设计，等比缩放塞进右侧，避免只看得到两屏
  var WIDE = { fullbleed: { w: 1660, h: 900 } };

  function applyFit() {
    var box = WIDE[currentKey];
    if (!box) {
      frame.style.width = '100%';
      frame.style.height = '100%';
      frame.style.transform = '';
      return;
    }
    var sw = stage.clientWidth;
    var sh = stage.clientHeight;
    var s = Math.min(sw / box.w, sh / box.h);
    var dx = Math.max(0, (sw - box.w * s) / 2);
    var dy = Math.max(0, (sh - box.h * s) / 2);
    frame.style.width = box.w + 'px';
    frame.style.height = box.h + 'px';
    frame.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
  }
  window.addEventListener('resize', applyFit);

  function setActive(key) {
    items.forEach(function (el) {
      el.classList.toggle('on', el.dataset.key === key);
    });
    var on = items.filter(function (el) { return el.dataset.key === key; })[0];
    if (on) openNew.href = on.dataset.file;
  }

  function show(file, key, plan) {
    var src = file;
    if (plan) src += '?only=' + plan;
    frame.src = src;
    setActive(key);
    currentPlan = plan || '';
    currentKey = key;
    applyFit();
    chips.forEach(function (b) {
      b.classList.toggle('on', (b.dataset.plan || '') === currentPlan);
    });
    try { history.replaceState(null, '', '#' + (plan ? 'plan-' + plan.toLowerCase() : key)); } catch (e) {}
  }

  items.forEach(function (el) {
    el.addEventListener('click', function () {
      show(el.dataset.file, el.dataset.key, '');
    });
  });

  chips.forEach(function (b) {
    b.addEventListener('click', function () {
      show('light-theme-preview.html', 'light', b.dataset.plan);
    });
  });

  // 支持 #ui / #light / #sand / #fullbleed / #plan-a 直接定位
  (function () {
    var h = (location.hash || '').replace('#', '').toLowerCase();
    if (!h) return;
    if (h.indexOf('plan-') === 0) {
      show('light-theme-preview.html', 'light', h.slice(5).toUpperCase());
      return;
    }
    var hit = items.filter(function (el) { return el.dataset.key === h; })[0];
    if (hit) show(hit.dataset.file, hit.dataset.key, '');
  })();

  // 无深链时默认高亮第一项（iframe 初始 src 已是初版稿，不重复加载）
  if (!document.querySelector('.item.on')) setActive('ui');
</script>
</body>
</html>
